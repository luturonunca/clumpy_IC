[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clumpIC"
version = "0.1.0"
description = "Equilibrium N-body initial conditions by Eddington inversion (based on nbopy)"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
hdf5 = ["h5py"]

[project.scripts]
clumpIC = "clumpIC.cli:main"

[tool.setuptools]
packages = ["clumpIC"]
