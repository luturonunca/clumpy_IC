; clumpIC -c hernquist_sink_orbit.ini
; Live Hernquist halo with a star and a sink on mirrored circular orbits (sink orbit test,
; phase C). Units: kpc, km/s, Msol; RAMSES units copied from &UNITS_PARAMS.

[model]                 ; dimensionless alpha-beta-gamma profile, Eddington inversion
alpha = 1
beta  = 4
gamma = 1               ; 1,4,1 = Hernquist
rmin  = 1e-2            ; sampled radii, in units of rscale
rmax  = 4.5
npart = 1e5
seed  = 667408
ne    = 1e4             ; energy / radius grid sizes
nr    = 1e4

[scaling]
mass     = 1e11         ; Msol, mass of the untruncated profile (particles carry the part in rmin-rmax)
rscale   = 1.0          ; kpc
centre   = 0,0,0        ; kpc, relative to the RAMSES box centre
velocity = 0,0,0        ; km/s
recentre = true         ; put the sampled centre of mass at rest on 'centre'

[particles]             ; x, y, z [kpc], vx, vy, vz [km/s, or +-vc], m [Msol]
star = 2.0, 0.0, 0.0, 0.0, vc, 0.0, 1e8

[sinks]                 ; as [particles], plus optional m_smbh [Msol]
sink = -2.0, 0.0, 0.0, 0.0, -vc, 0.0, 1e8

[output]
name  = halo            ; -> halo.npy, halo.hdf5, halo_ramses/ic_part (+ ic_sink)
npy   = false
hdf5  = false
ramses_ascii  = true
units_length  = 3.0857d21
units_density = 6.77d-23
units_time    = 4.705d14
